.ln{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;padding:3px 0}
.tt{display:flex;justify-content:space-between;font-weight:800;color:var(--ink);border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.fm label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px;color:var(--mute)}

.cta{width:100%;margin-top:14px;border:0;background:var(--o);color:#fff;border-radius:14px;padding:12px;font-weight:700;font-size:16px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px}
.pc .im{aspect-ratio:1/.85;background:var(--sand);border-radius:14px;display:grid;place-items:center;font-size:44px;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}

.tl{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;padding:30px 0 50px}
#mp{height:420px;border-radius:22px;border:1px solid var(--line);z-index:1}
.stp{display:flex;gap:12px;margin-top:12px;color:var(--mute)}.stp b{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;flex:none}

.oc{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--bg)}
.oc small{color:var(--mute)}
.er{color:#c0392b;min-height:22px;font-size:14px}.ok{color:var(--g)}
.lnk{background:none;border:0;color:var(--g);font-weight:700;padding:4px}
.emp{text-align:center;color:var(--mute);padding:22px}
.ptb{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:860px){.lay,.tl,.ptb{grid-template-columns:1fr}.cart{position:static}.svc{grid-template-columns:1fr}.sh{flex-direction:column;text-align:center}.track button{padding:10px 12px;font-size:13px}.logo span:first-child{font-size:20px}}
</style>

function ordersV(){const O=[...D.myOrders].sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
return nav()+`<div class="wrap" style="padding:24px 20px"><h2>طلباتي</h2>${O.length?O.map(o=>`<a class="oc" style="display:block;margin-top:12px" href="#/track/${o.id}"><b>${esc(o.storeName)}</b> <span class="pl ${o.status==="done"?"":"w"}">${OL[o.status]}</span><br><small>${(o.items||[]).map(i=>esc(i.name)+" ×"+i.q).join("، ")} — ${fmt(o.total)}</small></a>`).join(""):`<div class="emp">لا توجد طلبات بعد.</div>`}</div>`}

function trackV(){return nav()+`<div class="wrap"><div class="tl"><div class="box" id="ti">جارٍ التحميل...</div><div id="mp"></div></div></div>`}
function upd(){const o=lastO;if(!o||!$("#ti"))return;const k=Math.max(0,SO.indexOf(o.status)),d=km(rl,o.loc),eta=o.status==="onway"&&d!=null?`<p>⏱ يصلك خلال حوالي <b>${Math.max(1,Math.round(d*3))}</b> دقيقة (تقدير)</p>`:"";
$("#ti").innerHTML=`<small>طلب #${esc(o.id)} · ${esc(o.storeName)}</small><h2>${OL[o.status]}</h2>${eta}${SO.map((s,i)=>`<div class="stp ${o.status!=="cancelled"&&i<=k?"ok":""}"><b>${i<=k?"✓":i+1}</b>${OL[s]}</div>`).join("")}
<div class="oc" style="margin-top:14px">🛵 ${o.riderId?`<b>${esc(o.riderName)}</b> ${o.riderPhone?`<a class="sm" href="tel:${esc(o.riderPhone)}">📞 اتصال</a>`:""}`:"في انتظار قبول أحد العمال"}</div><b>${fmt(o.total)}</b> <small>· ${esc(o.payLabel)}</small>`;
if(M){setMk("s","🏬",o.storeLoc);setMk("b","🏠",o.loc);setMk("r","🛵",rl);const pts=Object.values(mk).map(m=>m.getLatLng());if(pts.length)M.fitBounds(L2.latLngBounds(pts),{padding:[40,40],maxZoom:15})}}
const L2=window.L;
const ic=e=>L2.divIcon({html:`<div style="font-size:28px;line-height:1">${e}</div>`,className:"",iconSize:[30,30],iconAnchor:[15,15]});
function setMk(k,e,p){if(!p)return;if(mk[k])mk[k].setLatLng([p.lat,p.lng]);else mk[k]=L2.marker([p.lat,p.lng],{icon:ic(e)}).addTo(M)}
function startTrack(id){if(!U){$("#ti").innerHTML=`سجّل دخولك لتتبع الطلب. <a class="sm g" href="#/auth">دخول</a>`;return}
M=L2.map("mp").setView([15.5007,32.5599],12);L2.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(M);let rid=null;
tu.push(onSnapshot(doc(db,"orders",id),s=>{if(!s.exists()){$("#ti").textContent="لم نجد هذا الطلب.";return}lastO={id,...s.data()};if(lastO.riderId&&rid!==lastO.riderId){rid=lastO.riderId;tu.push(onSnapshot(doc(db,"riderLoc",rid),r=>{rl=r.data()||null;upd()}))}upd()},()=>{$("#ti").textContent="لا تملك صلاحية عرض هذا الطلب."}))}

function myStoreV(){if(P&&P.role!=="store")return nav()+`<div class="wrap"><div class="emp">هذه الصفحة لأصحاب المتاجر.</div></div>`;const s=D.myStore,act=P?.status==="active"&&s?.status==="active";
return nav()+`<div class="wrap" style="padding:24px 20px"><h2>لوحة متجري ${s?`— ${esc(s.name)}`:""}</h2>
${!act?`<div class="box"><b>حسابك ${P?.status==="pending"||s?.status==="pending"?"بانتظار موافقة الإدارة":"موقوف"}.</b><p>لتفعيل المتجر: ادفع اشتراك المتجر <b>${fmt(D.set.subFee)}</b>.<br>${esc(D.set.payInfo||"سيتواصل معك المدير بتفاصيل الدفع.")}</p></div>`:""}
${s?`<div class="ptb"><div class="box fm"><h2>طرق الدفع في متجرك</h2>${(s.payMethods||[]).map((m,i)=>`<div class="cr"><span><b>${esc(m.label)}</b><br><small>${esc(m.details)}</small></span><button class="sm d m" data-pd="${i}">حذف</button></div>`).join("")}${act?`<form id="pmf"><label for="pl">اسم الطريقة (مثال: تحويل بنكك)</label><input id="pl" required><label for="pt">التفاصيل (رقم الحساب واسم صاحبه)</label><input id="pt"><button class="cta">إضافة طريقة دفع</button></form>`:""}</div>
${act?`<form class="box fm" id="pf"><h2>إضافة منتج</h2><label for="n1">الاسم</label><input id="n1" required><label for="r1">السعر (ج.س)</label><input id="r1" type="number" min="0" required><label for="d1">الوصف</label><input id="d1"><label for="i1">الصورة</label><input id="i1" type="file" accept="image/*"><div class="er" id="er"></div><button class="cta">إضافة المنتج</button></form>`:""}</div>
<div class="box"><h2>منتجاتي</h2><div class="pg">${D.myProds.map(p=>`<div class="pc"><div class="im">${p.img?`<img src="${esc(p.img)}" alt="">`:"📦"}</div><h3>${esc(p.name)}</h3><div class="pr">${fmt(p.price)}</div><button data-pv="${p.id}">${p.available===false?"إظهار":"إخفاء"}</button><button data-pdel="${p.id}" style="color:#c0392b">حذف</button></div>`).join("")||`<div class="emp" style="grid-column:1/-1">لا توجد منتجات.</div>`}</div></div>
<div class="box"><h2>الطلبات الواردة</h2>${[...D.sOrders].sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)).map(o=>`<div class="oc"><b>${esc(o.buyerName)}</b> <span class="pl ${o.status==="done"?"":"w"}">${OL[o.status]}</span><br><small>${(o.items||[]).map(i=>esc(i.name)+" ×"+i.q).join("، ")}<br>${esc(o.payLabel)} · ${fmt(o.total)}${o.riderName?` · العامل: ${esc(o.riderName)}`:""}</small>${["new","preparing"].includes(o.status)?`<div><button class="sm g" data-os="${o.id}|${o.status==="new"?"preparing":"ready"}">${o.status==="new"?"بدء التجهيز":"جاهز للاستلام"}</button><button class="sm d" data-os="${o.id}|cancelled">إلغاء</button></div>`:""}</div>`).join("")||`<div class="emp">لا توجد طلبات.</div>`}</div>`:`<div class="emp">لم يتم العثور على متجرك.</div>`}</div>`}

function clean(){tu.forEach(f=>f());tu=[];D.prods=[];if(pu){pu();pu=null}if(M){M.remove();M=null}mk={};lastO=null;rl=null}
function render(soft){if(!ready)return;if(soft&&["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))return;
const h=location.hash||"#/",a=$("#app");if(soft&&h.startsWith("#/track")&&M)return;
if(h.startsWith("#/track")){if(M)return;clean();a.innerHTML=trackV();startTrack(h.split("/")[2]);return}
if(h.startsWith("#/store/")){const id=h.split("/")[2];if(!pu)pu=onSnapshot(query(collection(db,"products"),where("storeId","==",id)),s=>{D.prods=s.docs.map(d=>({id:d.id,...d.data()}));render(1)});a.innerHTML=storeV(id)}
else if(h==="#/auth"||h==="#/join"){if(U&&P){location.hash=P.role==="store"?"#/mystore":"#/";return}a.innerHTML=authV(h==="#/join"?"rider":"buyer")}
else if(h==="#/orders")a.innerHTML=U?ordersV():authV("buyer");
else if(h==="#/mystore")a.innerHTML=U?myStoreV():authV("buyer");
else a.innerHTML=home()}
addEventListener("hashchange",()=>{clean();if(location.hash==="#/join")mode="up";render()});

document.addEventListener("click",async e=>{const t=e.target.closest("button,a");if(!t)return;const d=t.dataset;
try{if(d.out){await A.signOut(auth);location.hash="#/"}
if(d.m2){mode=d.m2;render()}
if(d.c){cat=d.c;render(0)}
if(d.a){const p=D.prods.find(x=>x.id===d.a),sid=location.hash.split("/")[2];if(cartStore!==sid){if(Object.keys(cart).length&&!confirm("سلتك من متجر آخر. هل تريد تفريغها؟"))return;cart={};cartStore=sid}cart[p.id]=cart[p.id]||{id:p.id,name:p.name,price:+p.price,q:0};cart[p.id].q++;render()}
if(d.m){if(--cart[d.m].q<=0)delete cart[d.m];render()}
if(d.loc||d.sloc)navigator.geolocation.getCurrentPosition(p=>{const c={lat:p.coords.latitude,lng:p.coords.longitude};if(d.loc){ck.loc=c;render()}else{sloc=c;t.textContent="✓ تم تحديد الموقع"}},()=>alert("فعّل خدمة الموقع في المتصفح."));
if(d.go){const s=D.stores.find(x=>x.id===d.go),its=Object.values(cart),er=$("#er");if(!U||!P){location.hash="#/auth";return}
if(!ck.addr.trim()||!(ck.phone||P.phone)){er.textContent="اكتب العنوان ورقم الهاتف.";return}
const sub=its.reduce((a,i)=>a+i.price*i.q,0),m=(s.payMethods||[])[+ck.pay]||{label:"كاش عند الاستلام"};
const r=await addDoc(collection(db,"orders"),{buyerId:U.uid,buyerName:P.name,buyerPhone:ck.phone||P.phone,ownerId:s.ownerId,storeId:s.id,storeName:s.name,storeLoc:s.lat!=null?{lat:s.lat,lng:s.lng}:null,items:its,sub,fee:+D.set.deliveryFee||0,total:sub+(+D.set.deliveryFee||0),payLabel:m.label,addr:ck.addr.trim(),loc:ck.loc,status:"new",riderId:null,createdAt:serverTimestamp()});
cart={};ck.addr="";location.hash="#/track/"+r.id}
if(d.pd!==undefined){const m=[...D.myStore.payMethods];m.splice(+d.pd,1);await updateDoc(doc(db,"stores",D.myStore.id),{payMethods:m})}
if(d.pv){const p=D.myProds.find(x=>x.id===d.pv);await updateDoc(doc(db,"products",p.id),{available:p.available===false})}
if(d.pdel&&confirm("حذف المنتج؟"))await deleteDoc(doc(db,"products",d.pdel));
if(d.os){const[i,s]=d.os.split("|");await updateDoc(doc(db,"orders",i),{status:s})}}
catch(x){alert("تعذر التنفيذ: "+(x.code||x.message))}});
document.addEventListener("input",e=>{const k=e.target.dataset.ck;if(k)ck[k]=e.target.value;if(e.target.id==="sq"){q=e.target.value.trim();render()}});
document.addEventListener("change",e=>{if(e.target.dataset.ck){ck[e.target.dataset.ck]=e.target.value;if(e.target.dataset.ck==="pay")render()}if(e.target.id==="rl")$("#stf").hidden=e.target.value!=="store"});
document.addEventListener("submit",async e=>{e.preventDefault();const id=e.target.id,v=x=>$("#"+x)?.value.trim(),er=m=>{const n=$("#er");if(n)n.textContent=m};
try{if(id==="tf"){const t=v("tn");if(t)location.hash="#/track/"+t}
if(id==="af"){const em=v("em");if(mode==="in")await A.signInWithEmailAndPassword(auth,em,$("#pw").value);
else if(mode==="fp"){await A.sendPasswordResetEmail(auth,em);er("تم إرسال رابط الاسترجاع لبريدك.")}
else{const role=v("rl"),f=$("#si")?.files[0];if(role==="store"&&(!v("sn")||!f)){er("اكتب اسم المتجر وارفع صورة الهوية.");return}const idImg=role==="store"?await img(f,900,.7):null;
const c=await A.createUserWithEmailAndPassword(auth,em,$("#pw").value),u=c.user.uid;
await setDoc(doc(db,"users",u),{email:em,name:v("nm"),phone:v("ph"),role,status:role==="buyer"?"active":"pending",createdAt:serverTimestamp()});
if(role==="store"){await setDoc(doc(db,"kyc",u),{idImg});await addDoc(collection(db,"stores"),{ownerId:u,ownerName:v("nm"),name:v("sn"),category:v("sc"),address:v("sa"),phone:v("ph"),lat:sloc?.lat??null,lng:sloc?.lng??null,status:"pending",payMethods:[{label:"كاش عند الاستلام",details:""}],createdAt:serverTimestamp()})}
if(role==="rider")alert("تم إرسال طلبك. بعد موافقة الإدارة سجّل دخولك من تطبيق عمال التوصيل (staff.html).")}}
if(id==="pmf"){await updateDoc(doc(db,"stores",D.myStore.id),{payMethods:[...(D.myStore.payMethods||[]),{label:v("pl"),details:v("pt")}]});e.target.reset()}
if(id==="pf"){const f=$("#i1").files[0];await addDoc(collection(db,"products"),{storeId:D.myStore.id,ownerId:U.uid,name:v("n1"),price:+v("r1"),desc:v("d1"),img:f?await img(f,640,.7):"",available:true,createdAt:serverTimestamp()});e.target.reset()}}
catch(x){er(emsg(x))}});
setTimeout(()=>{if(!ready){ready=true;render()}},2500);
render();
</script>
